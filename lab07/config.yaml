seed: 42

data:
  dataset: FashionMNIST
  root: lab03/src/data
  download: true
  train_size: 55000
  val_size: 5000
  batch_size: 256
  eval_batch_size: 256

baseline:
  channels: [24, 48, 160]
  fc_hidden: 640
  num_classes: 10
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001

pruning:
  unstructured_sparsities: [0.0, 0.25, 0.5, 0.75, 0.9, 0.95]
  structured_filter_ratios: [0.10, 0.25, 0.50]
  finetune_epochs: 3
  finetune_lr: 0.0003
  weight_decay: 0.0001

distillation:
  conv_channels: [16, 32]
  fc_hidden: 60
  num_classes: 10
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001
  temperature: 4.0
  alpha: 0.5

benchmark:
  warmup_single: 50
  iters_single: 400
  warmup_batch: 15
  iters_batch: 60
  latency_batch_size: 128
  energy_repeats: 30
  country_iso_code: POL

paths:
  results_dir: lab07/results
  checkpoints_dir: lab07/results/checkpoints
