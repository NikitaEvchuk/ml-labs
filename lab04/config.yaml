pipeline_metadata:
  name: Lab 4 Data Pipeline and Quality
  author: Student
  dataset: UCI Adult (OpenML name='adult', version=2)
  random_seed: 42
raw_data:
  source: OpenML
  name: adult
  version: 2
  row_count: 48842
  column_count: 15
  target_column: income
  positive_label: '>50K'
  negative_label: <=50K
validation_schema:
  numeric_ranges:
    age:
    - 17
    - 90
    hours_per_week:
    - 1
    - 99
    capital_gain:
    - 0
    - 99999
    capital_loss:
    - 0
    - 4356
  null_policy: Question mark '?' or NaN denotes missing value; missing values are
    imputed, not silently dropped
split_and_cleaning:
  train_ratio: 0.7
  test_ratio: 0.3
  stratified: true
  initial_train_rows: 34189
  test_rows: 14653
  train_duplicates_dropped: 24
  final_train_rows: 34165
  imputation:
    categorical_strategy: mode (fitted on train only)
    numerical_strategy: median (fitted on train only)
  outlier_clipping:
    lower_quantile: 0.01
    upper_quantile: 0.99
    computed_on: train set only
feature_engineering:
  derived_features:
  - name: capital_net
    formula: capital-gain - capital-loss
    description: Net capital gain or loss from investments
  - name: hours_per_age
    formula: hours-per-week / (age - 16)
    description: Weekly working hours scaled by years elapsed since minimum legal
      working age (16)
baseline_evaluation:
  without_derived_features:
    accuracy: 0.8559
    f1_binary: 0.6658
    f1_macro: 0.787
    features_count: 108
    train_time_sec: 0.335
  with_derived_features:
    accuracy: 0.8589
    f1_binary: 0.6721
    f1_macro: 0.7911
    features_count: 110
    train_time_sec: 0.366
  delta:
    accuracy_gain: 0.003
    f1_binary_gain: 0.0062
    f1_macro_gain: 0.0041
label_quality_audit:
  conflicting_feature_patterns: 5
  conflicting_total_rows: 10
  sample_50_impossible_values: 0
